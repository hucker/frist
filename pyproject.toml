[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "frist"
version = "0.21.0"
description = "Calendar-based time window filtering, age calculations, and business logic for dates and times."
authors = [
    { name = "Chuck Bass", email = "chuck@acrocad.net" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Runtime dependencies: the only third-party import in src/frist is dateutil.
dependencies = [
    "python-dateutil",
]

# Development tooling (PEP 735). Installed by `uv sync`; never part of the
# published wheel metadata.
[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "mypy",
    "hypothesis==6.100.*",
    "types-python-dateutil",
    "ruff==0.17.5",
    "ty==0.0.103",
]

[project.scripts]
frist = "frist.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--cov=frist --cov-report=term-missing"
markers = [
    "hypothesis: Property-based tests using Hypothesis library",
    "smoke: Quick smoke tests that exercise core API and fast checks",
]

[project.urls]
Homepage = "https://github.com/hucker/frist"
Repository = "https://github.com/hucker/frist"
Issues = "https://github.com/hucker/frist/issues"

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py310,py311,py312,py313,py314

[testenv]
deps =
    pytest
    pytest-cov
usedevelop = True
commands =
    pytest --cov=frist --cov-report=term-missing
"""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "Q"]  # Enable these rule categories

[tool.coverage.run]
omit = [
    "src/frist/__main__.py"
]
